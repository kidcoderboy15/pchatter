<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#22c55e" rx="180"/>
  
  <!-- Paddle -->
  <g id="paddle" transform="translate(512, 512)">
    <!-- Paddle face -->
    <ellipse cx="-80" cy="-120" rx="140" ry="180" fill="#ffffff" stroke="#111827" stroke-width="8"/>
    
    <!-- Paddle holes (pickleball paddle pattern) -->
    <circle cx="-80" cy="-180" r="12" fill="#22c55e"/>
    <circle cx="-120" cy="-150" r="12" fill="#22c55e"/>
    <circle cx="-40" cy="-150" r="12" fill="#22c55e"/>
    <circle cx="-80" cy="-120" r="12" fill="#22c55e"/>
    <circle cx="-120" cy="-90" r="12" fill="#22c55e"/>
    <circle cx="-40" cy="-90" r="12" fill="#22c55e"/>
    <circle cx="-80" cy="-60" r="12" fill="#22c55e"/>
    
    <!-- Paddle handle -->
    <rect x="-60" y="40" width="80" height="140" rx="8" fill="#111827"/>
    <rect x="-50" y="50" width="60" height="120" rx="6" fill="#374151"/>
    
    <!-- Grip tape details -->
    <line x1="-50" y1="70" x2="10" y2="70" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="-50" y1="90" x2="10" y2="90" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="-50" y1="110" x2="10" y2="110" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="-50" y1="130" x2="10" y2="130" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
    <line x1="-50" y1="150" x2="10" y2="150" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Pickleball -->
  <g id="ball" transform="translate(650, 380)">
    <!-- Ball shadow -->
    <ellipse cx="4" cy="4" rx="65" ry="65" fill="#000000" opacity="0.15"/>
    
    <!-- Ball -->
    <circle cx="0" cy="0" r="65" fill="#fef08a" stroke="#111827" stroke-width="6"/>
    
    <!-- Ball holes (pickleball pattern) -->
    <circle cx="0" cy="-30" r="10" fill="#111827"/>
    <circle cx="26" cy="-15" r="10" fill="#111827"/>
    <circle cx="26" cy="15" r="10" fill="#111827"/>
    <circle cx="0" cy="30" r="10" fill="#111827"/>
    <circle cx="-26" cy="15" r="10" fill="#111827"/>
    <circle cx="-26" cy="-15" r="10" fill="#111827"/>
    <circle cx="0" cy="0" r="10" fill="#111827"/>
  </g>
  
  <!-- Motion lines for dynamic effect -->
  <g id="motion-lines" opacity="0.3">
    <path d="M 580 320 Q 560 300 540 280" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 600 340 Q 580 320 560 300" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 620 360 Q 600 340 580 320" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
